<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>效果检查器</title><link rel="stylesheet" href="css/inspector.css?v=115"></head>
<body><header><h1>效果检查器</h1><details class="ins-help"><summary>新手教程</summary><div><p>从「部署：抽两张牌」开始，按步骤学习选目标、筛选、变量与自定义卡池。</p><button type="button" data-inspector-tutorial>打开新手教程</button><p>教程会在当前页面打开，关闭后可以继续编辑。</p></div></details><a href="./index.html">返回游戏</a></header><div id="host"><p>加载中…</p></div>
<script src="js/auto-save.js?v=113"></script><script src="js/engine.js?v=113"></script><script src="js/primitives-extra.js"></script><script src="js/primitives.js?v=113"></script><script src="js/effects.js?v=113"></script><script src="js/effect-primitives.js?v=113"></script><script src="js/compiler.js"></script><script src="js/cards.js"></script><script src="js/effects-data.js"></script><script src="js/effect-contract.js?v=113"></script><script src="js/effect-inspector.js?v=113"></script><script src="js/effect-editor.js?v=115"></script>
<script src="js/inspector-help.js?v=1"></script>
<script>(async()=>{const host=document.getElementById('host');try{await KG_AUTO_SAVE.init();await Promise.all([['effect-labels.json','KG_EFFECT_LABELS'],['op-docs.json','KG_OP_DOCS']].map(async([file,key])=>{try{const r=await fetch('data/'+file);if(r.ok)window[key]=await r.json();}catch(e){console.warn('使用默认标签');}}));host.replaceChildren();window.KG_INSPECTOR=KG.inspector.mount(host);}catch(e){host.textContent='无法打开检查器：'+e.message;}})();</script></body></html>
